<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>mobneutralizer</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            color: #f0f0f0;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 24px 40px;
            border-bottom: 1px solid #252525;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 60px);
            margin-bottom: 16px;
        }

        p {
            color: #999;
            font-size: 18px;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        footer p {
            margin-bottom: 8px;
            font-size: 14px;
        }

        footer a {
            color: #7cffb2;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header>
        mobneutralizer
    </header>

    <main>
        <h1>Hey, I'm still workin' on it.</h1>
        <p>Come back later.</p>
    </main>

    <footer>
        <p>
            Other projects:
            <a href="https://calixas.mobneutralizer.com">Calixas</a>
        </p>

        <p>&copy; 2026 mobneutralizer</p>
    </footer>
</body>
</html>
