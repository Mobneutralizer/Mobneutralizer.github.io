
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b08">
    <title>Portfolio | mobneutralizer</title>
    <link rel="icon" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #13fe03;
            --bg: #080b08;
            --panel: #101410;
            --border: #253325;
            --muted: #8a9988;
            --text: #e0e9df;
            --red: #ff5d5d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Fira Code", monospace;
            line-height: 1.6;
        }

        a { color: var(--green); }

        .container {
            width: min(1100px, calc(100% - 36px));
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--border);
            background: #090d09;
        }

        .topbar {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            text-decoration: none;
            font-family: "Share Tech Mono", monospace;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .brand span { color: var(--text); }

        nav a {
            text-decoration: none;
            padding: 8px 12px;
            border: 1px solid var(--border);
        }

        nav a:hover {
            border-color: var(--green);
            background: #102010;
        }

        main { padding: 52px 0 70px; }

        .eyebrow {
            color: var(--green);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        h1, h2, h3 {
            font-family: "Share Tech Mono", monospace;
            line-height: 1.2;
        }

        h1 {
            color: var(--green);
            font-size: clamp(2.2rem, 6vw, 4rem);
            margin: 0 0 12px;
        }

        .intro {
            max-width: 720px;
            color: var(--muted);
            margin: 0 0 32px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 26px 0;
        }

        input, select, button {
            font: inherit;
        }

        input, select {
            min-width: 0;
            padding: 11px 13px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 0;
        }

        input {
            flex: 1 1 260px;
        }

        select { flex: 0 1 190px; }

        input:focus, select:focus {
            outline: 1px solid var(--green);
            border-color: var(--green);
        }

        .status {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 16px;
        }

        .status.error { color: var(--red); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: 20px;
        }

        .project {
            display: flex;
            flex-direction: column;
            min-width: 0;
            border: 1px solid var(--border);
            background: var(--panel);
            transition: border-color 0.15s, transform 0.15s;
        }

        .project:hover {
            border-color: var(--green);
            transform: translateY(-2px);
        }

        .preview {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            padding: 0;
            overflow: hidden;
            border: 0;
            border-bottom: 1px solid var(--border);
            background: #050705;
            color: var(--green);
            cursor: pointer;
        }

        .preview img, .preview video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview img { position: absolute; inset: 0; }

        .preview-placeholder {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 8px;
            padding: 20px;
            color: var(--muted);
            text-align: center;
            overflow-wrap: anywhere;
        }

        .preview-placeholder strong {
            color: var(--green);
            font-size: 1.1rem;
        }

        .play-indicator {
            position: absolute;
            right: 12px;
            bottom: 12px;
            padding: 5px 9px;
            border: 1px solid var(--green);
            background: #080b08e8;
            color: var(--green);
            font-size: 0.8rem;
        }

        .project-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 17px;
            gap: 10px;
        }

        .project h2 {
            margin: 0;
            font-size: 1.35rem;
            color: var(--green);
            overflow-wrap: anywhere;
        }

        .project p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .project-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: auto;
            padding-top: 12px;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .tag {
            color: var(--green);
            border: 1px solid var(--border);
            padding: 2px 7px;
        }

        .empty {
            border: 1px dashed var(--border);
            padding: 35px 20px;
            color: var(--muted);
            text-align: center;
        }

        footer {
            padding: 24px 0;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
        }

        /* Media viewer */
        .modal {
            position: fixed;
            z-index: 1000;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: #000e;
        }

        .modal.open { display: flex; }

        .modal-panel {
            width: min(1000px, 100%);
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border: 1px solid var(--green);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            margin: 0;
            color: var(--green);
            font-size: 1.1rem;
            overflow-wrap: anywhere;
        }

        .modal-controls {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .modal button {
            padding: 7px 11px;
            color: var(--green);
            background: var(--panel);
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .modal button:hover { border-color: var(--green); }

        .modal-content {
            min-height: 180px;
            overflow: auto;
            display: grid;
            place-items: center;
            padding: 14px;
        }

        .modal-content img,
        .modal-content video {
            display: block;
            max-width: 100%;
            max-height: 68vh;
            object-fit: contain;
        }

        .modal-message {
            max-width: 700px;
            color: var(--muted);
            padding: 22px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .modal-message strong {
            display: block;
            color: var(--red);
            margin-bottom: 8px;
        }

        .modal-message code {
            color: var(--green);
            overflow-wrap: anywhere;
        }

        .modal-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (max-width: 520px) {
            main { padding-top: 35px; }
            .topbar { min-height: 60px; }
            .modal { padding: 8px; }
            .modal-head { align-items: flex-start; }
            .modal-controls { gap: 4px; }
            .modal button { padding: 6px 8px; }
        }
    </style>
</head>

<body>
<header>
    <div class="container topbar">
        <a class="brand" href="/">mobneutralizer<span>.com</span></a>
        <nav aria-label="Main navigation">
            <a href="/">./home</a>
        </nav>
    </div>
</header>

<main class="container">
    <div class="eyebrow">root@mobneutralizer:~/portfolio$</div>
    <h1>Portfolio</h1>
    <p class="intro">
        Projects, experiments, and things I've made. Select a project to view its media.
    </p>

    <div class="toolbar">
        <input id="search" type="search" placeholder="Search projects..." aria-label="Search projects">
        <select id="category" aria-label="Filter by category">
            <option value="">All categories</option>
        </select>
    </div>

    <p id="status" class="status" role="status">Loading projects...</p>
    <section id="projects" class="grid" aria-label="Projects"></section>
</main>

<footer>
    <div class="container">
        © 2026 mobneutralizer. Built by me and my good friend chatgpt.
        <span style="float:right">Always work.</span>
    </div>
</footer>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
        <div class="modal-head">
            <h2 id="modalTitle" class="modal-title">Project</h2>
            <div class="modal-controls">
                <button id="previous" type="button" aria-label="Previous media">←</button>
                <button id="next" type="button" aria-label="Next media">→</button>
                <button id="close" type="button" aria-label="Close viewer">✕</button>
            </div>
        </div>
        <div id="modalContent" class="modal-content"></div>
        <div class="modal-foot">
            <span id="mediaCounter"></span>
            <span>ESC to close · ← → to navigate</span>
        </div>
    </div>
</div>

<script>
(() => {
    "use strict";

    const projectsElement = document.getElementById("projects");
    const searchElement = document.getElementById("search");
    const categoryElement = document.getElementById("category");
    const statusElement = document.getElementById("status");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalContent = document.getElementById("modalContent");
    const mediaCounter = document.getElementById("mediaCounter");
    const previousButton = document.getElementById("previous");
    const nextButton = document.getElementById("next");
    const closeButton = document.getElementById("close");

    let projects = [];
    let activeProject = null;
    let activeMediaIndex = 0;
    let lastFocusedElement = null;

    // Keep project media paths relative to portfolio/index.html.
    // Example: "media/the-woods.mp4"
    function mediaUrl(path) {
        if (typeof path !== "string" || !path.trim()) return "";
        return path.trim();
    }

    function listOf(value) {
        if (Array.isArray(value)) {
            return value.filter(item => typeof item === "string" && item.trim());
        }
        if (typeof value === "string" && value.trim()) return [value.trim()];
        return [];
    }

    function getImages(project) {
        return listOf(project.images);
    }

    function getVideos(project) {
        return listOf(project.videos);
    }

    function getMedia(project) {
        return [
            ...getImages(project).map(src => ({ type: "image", src })),
            ...getVideos(project).map(src => ({ type: "video", src }))
        ];
    }

    function setStatus(message, isError = false) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error", isError);
    }

    function makePlaceholder(title, message = "No preview available") {
        const placeholder = document.createElement("div");
        placeholder.className = "preview-placeholder";

        const heading = document.createElement("strong");
        heading.textContent = title || "Untitled project";

        const detail = document.createElement("span");
        detail.textContent = message;

        placeholder.append(heading, detail);
        return placeholder;
    }

    /*
     * Preview priority:
     * 1. project.preview, if explicitly supplied
     * 2. The first project image
     * 3. A captured frame from the first video
     * 4. A text placeholder
     */
    function buildPreview(project, container) {
        container.replaceChildren();

        const videos = getVideos(project);
        const images = getImages(project);
        const explicitPreview = mediaUrl(project.preview);
        const imageFallback = images.length ? mediaUrl(images[0]) : "";

        function tryVideoFrame() {
            if (!videos.length) {
                container.replaceChildren(makePlaceholder(project.title));
                return;
            }

            const video = document.createElement("video");
            video.muted = true;
            video.playsInline = true;
            video.preload = "metadata";
            video.setAttribute("aria-hidden", "true");
            video.style.position = "absolute";
            video.style.width = "1px";
            video.style.height = "1px";
            video.style.opacity = "0";
            video.style.pointerEvents = "none";

            let finished = false;

            function failPreview() {
                if (finished) return;
                finished = true;
                video.remove();

                container.replaceChildren(
                    makePlaceholder(
                        project.title,
                        "No thumbnail — open project to check its media"
                    )
                );
            }

            function captureFrame() {
                if (finished) return;

                try {
                    const width = video.videoWidth;
                    const height = video.videoHeight;

                    if (!width || !height) {
                        failPreview();
                        return;
                    }

                    const canvas = document.createElement("canvas");
                    canvas.width = width;
                    canvas.height = height;

                    const context = canvas.getContext("2d");
                    context.drawImage(video, 0, 0, width, height);

                    const image = document.createElement("img");
                    image.alt = project.title + " preview";
                    image.loading = "lazy";
                    image.src = canvas.toDataURL("image/jpeg", 0.82);

                    finished = true;
                    video.remove();
                    container.replaceChildren(image);
                } catch {
                    failPreview();
                }
            }

            video.addEventListener("loadedmetadata", () => {
                // Seek slightly into the video to avoid a blank first frame.
                if (video.duration > 0.15) {
                    video.currentTime = 0.1;
                } else {
                    captureFrame();
                }
            }, { once: true });

            video.addEventListener("seeked", captureFrame, { once: true });
            video.addEventListener("error", failPreview, { once: true });

            // Avoid waiting forever if the video cannot be decoded.
            window.setTimeout(() => {
                if (!finished) failPreview();
            }, 10000);

            video.src = mediaUrl(videos[0]);
            container.appendChild(video);
        }

        function tryImage(path, onFailure) {
            const image = document.createElement("img");
            image.alt = project.title + " preview";
            image.loading = "lazy";

            image.addEventListener("error", () => {
                image.remove();
                onFailure();
            }, { once: true });

            image.addEventListener("load", () => {
                // Only attach a valid image to the card.
                if (!container.contains(image)) {
                    container.replaceChildren(image);
                }
            }, { once: true });

            image.src = path;
            container.replaceChildren(image);
        }

        if (explicitPreview) {
            tryImage(explicitPreview, () => {
                if (imageFallback && imageFallback !== explicitPreview) {
                    tryImage(imageFallback, tryVideoFrame);
                } else {
                    tryVideoFrame();
                }
            });
        } else if (imageFallback) {
            tryImage(imageFallback, tryVideoFrame);
        } else {
            tryVideoFrame();
        }
    }

    function createProjectCard(project) {
        const card = document.createElement("article");
        card.className = "project";

        const previewButton = document.createElement("button");
        previewButton.type = "button";
        previewButton.className = "preview";
        previewButton.setAttribute("aria-label", "Open " + (project.title || "project"));

        buildPreview(project, previewButton);

        if (getMedia(project).length) {
            const play = document.createElement("span");
            play.className = "play-indicator";
            play.textContent = "VIEW ↗";
            previewButton.appendChild(play);
        }

        previewButton.addEventListener("click", () => openProject(project));

        const body = document.createElement("div");
        body.className = "project-body";

        const title = document.createElement("h2");
        title.textContent = project.title || "Untitled project";

        const description = document.createElement("p");
        description.textContent = project.description || "No description provided.";

        const meta = document.createElement("div");
        meta.className = "project-meta";

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = project.category || "Other";

        const date = document.createElement("span");
        date.textContent = project.date || "";

        meta.append(tag, date);
        body.append(title, description, meta);
        card.append(previewButton, body);

        return card;
    }

    function renderProjects() {
        const query = searchElement.value.trim().toLowerCase();
        const category = categoryElement.value;

        const filtered = projects.filter(project => {
            const searchable = [
                project.title,
                project.description,
                project.category,
                project.date
            ].join(" ").toLowerCase();

            return searchable.includes(query) &&
                (!category || (project.category || "Other") === category);
        });

        projectsElement.replaceChildren();

        if (!filtered.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.style.gridColumn = "1 / -1";
            empty.textContent = projects.length
                ? "No projects match your search."
                : "No projects have been added yet.";
            projectsElement.appendChild(empty);
        } else {
            filtered.forEach(project => {
                projectsElement.appendChild(createProjectCard(project));
            });
        }

        setStatus(`${filtered.length} project${filtered.length === 1 ? "" : "s"} found.`);
    }

    function populateCategories() {
        const categories = [...new Set(
            projects.map(project => project.category || "Other")
        )].sort((a, b) => a.localeCompare(b));

        categoryElement.replaceChildren();

        const allOption = document.createElement("option");
        allOption.value = "";
        allOption.textContent = "All categories";
        categoryElement.appendChild(allOption);

        categories.forEach(category => {
            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            categoryElement.appendChild(option);
        });
    }

    function showMediaError(src, video) {
        modalContent.replaceChildren();

        const message = document.createElement("div");
        message.className = "modal-message";

        const heading = document.createElement("strong");
        heading.textContent = video
            ? "The browser could not play this video."
            : "The image could not be loaded.";

        const explanation = document.createElement("p");
        explanation.textContent = video
            ? "Check that the file exists and uses a browser-compatible codec. MP4 files encoded with H.264 video and AAC audio are a good choice."
            : "Check that the image path is correct and the file has been uploaded.";

        const path = document.createElement("code");
        path.textContent = src;

        message.append(heading, explanation, path);

        if (video) {
            const tip = document.createElement("p");
            tip.textContent = "If the path looks correct, try re-encoding the video as H.264/AAC MP4.";
            message.appendChild(tip);
        }

        modalContent.appendChild(message);
    }

    function showMedia(index) {
        if (!activeProject) return;

        const media = getMedia(activeProject);

        if (!media.length) {
            modalContent.replaceChildren(
                makePlaceholder(activeProject.title, "This project has no images or videos yet.")
            );
            mediaCounter.textContent = "No media";
            previousButton.disabled = true;
            nextButton.disabled = true;
            return;
        }

        activeMediaIndex = (index + media.length) % media.length;
        const item = media[activeMediaIndex];

        modalTitle.textContent = activeProject.title || "Project";
        modalContent.replaceChildren();

        previousButton.disabled = media.length < 2;
        nextButton.disabled = media.length < 2;
        mediaCounter.textContent = `${activeMediaIndex + 1} / ${media.length}`;

        if (item.type === "image") {
            const image = document.createElement("img");
            image.alt = activeProject.title || "Project image";
            image.src = mediaUrl(item.src);
            image.addEventListener("error", () => showMediaError(item.src, false), { once: true });
            modalContent.appendChild(image);
        } else {
            const video = document.createElement("video");
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.preload = "metadata";
            video.src = mediaUrl(item.src);

            video.addEventListener("error", () => {
                showMediaError(item.src, true);
            }, { once: true });

            modalContent.appendChild(video);

            // If autoplay is blocked, the controls still let the visitor play it.
            video.play().catch(() => {});
        }
    }

    function openProject(project) {
        activeProject = project;
        activeMediaIndex = 0;
        lastFocusedElement = document.activeElement;

        modal.classList.add("open");
        document.body.style.overflow = "hidden";
        showMedia(0);
        closeButton.focus();
    }

    function closeModal() {
        modal.classList.remove("open");
        document.body.style.overflow = "";

        const video = modalContent.querySelector("video");
        if (video) {
            video.pause();
            video.removeAttribute("src");
            video.load();
        }

        modalContent.replaceChildren();
        activeProject = null;

        if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
            lastFocusedElement.focus();
        }
    }

    searchElement.addEventListener("input", renderProjects);
    categoryElement.addEventListener("change", renderProjects);

    previousButton.addEventListener("click", () => {
        if (activeProject) showMedia(activeMediaIndex - 1);
    });

    nextButton.addEventListener("click", () => {
        if (activeProject) showMedia(activeMediaIndex + 1);
    });

    closeButton.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
        if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
        if (!modal.classList.contains("open")) return;

        if (event.key === "Escape") closeModal();
        if (event.key === "ArrowLeft" && activeProject) showMedia(activeMediaIndex - 1);
        if (event.key === "ArrowRight" && activeProject) showMedia(activeMediaIndex + 1);
    });

    async function init() {
        try {
            const response = await fetch("./projects.json", { cache: "no-store" });

            if (!response.ok) {
                throw new Error(`projects.json returned HTTP ${response.status}`);
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.projects)) {
                throw new Error('projects.json must contain a "projects" array.');
            }

            projects = data.projects;
            populateCategories();
            renderProjects();
        } catch (error) {
            console.error("Portfolio loading error:", error);
            projectsElement.replaceChildren();

            const empty = document.createElement("div");
            empty.className = "empty";
            empty.style.gridColumn = "1 / -1";
            empty.textContent = "Could not load projects. Check portfolio/projects.json and the browser console.";
            projectsElement.appendChild(empty);

            setStatus("Portfolio failed to load: " + error.message, true);
        }
    }

    init();
})();
</script>
</body>
</html>
